<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173B63" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Result of your GubbiGo account deletion request." />
    <title>Delete my data — GubbiGo</title>
    <link rel="icon" href="../favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="../" aria-label="GubbiGo home">
          <img src="../logo.svg" width="36" height="36" alt="" />
          <span class="wordmark"><span class="gubbi">Gubbi</span><span class="go">Go</span></span>
        </a>
        <nav class="site-nav" aria-label="Site">
          <a href="../">Home</a>
          <a href="../privacy/">Privacy</a>
          <a href="../terms/">Terms</a>
          <a href="../support/">Support</a>
          <a href="./">Delete data</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="page-header">
        <p class="eyebrow">Privacy</p>
        <h1 id="done-title">Working…</h1>
      </div>

      <article class="doc">
        <div class="note" id="done-panel"></div>
        <p class="doc-note">
          <a href="../">Back to GubbiGo</a> ·
          <a href="mailto:developer@xlang.in">developer@xlang.in</a>
        </p>
      </article>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          <a class="brand" href="../" aria-label="GubbiGo home">
            <img src="../logo.svg" width="36" height="36" alt="" />
            <span class="wordmark"><span class="gubbi">Gubbi</span><span class="go">Go</span></span>
          </a>
          <p>Indian language lessons that stay on your device.</p>
        </div>
        <nav class="footer-links" aria-label="Footer">
          <a href="../privacy/">Privacy</a>
          <a href="../terms/">Terms</a>
          <a href="../support/">Support</a>
          <a href="./">Delete data</a>
          <a href="mailto:developer@xlang.in">developer@xlang.in</a>
        </nav>
        <p class="copyright">© 2026 GubbiGo</p>
      </div>
    </footer>

    <script>
      (function () {
        var result = new URLSearchParams(location.search).get("result");
        var copy = {
          done: [
            "Account deleted",
            "Your GubbiGo account and the data we control for it have been deleted.",
          ],
          not_found: [
            "No matching account",
            "We could not find a GubbiGo account using that email. If you never saved progress with Google, there is likely nothing on our servers tied to it.",
          ],
          expired: [
            "Link expired",
            "This confirmation link is more than 24 hours old. Submit the delete-data form again to get a new one.",
          ],
          invalid: [
            "Link not valid",
            "This confirmation link is invalid or was already used.",
          ],
        }[result] || [
          "Something went wrong",
          "Email developer@xlang.in and we will help.",
        ];

        document.getElementById("done-title").textContent = copy[0];
        var panel = document.getElementById("done-panel");
        panel.textContent = copy[1];
        if (result === "done") {
          panel.classList.add("form-status-ok");
        }
      })();
    </script>
  </body>
</html>
